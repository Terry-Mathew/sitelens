name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking checks. Make "Blocking checks" a required status check in branch protection.
  verify:
    name: Blocking checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (errors fail, complexity warnings are advisory)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Production dependency audit (high and critical)
        run: npm run audit:prod

  # Advisory checks. They report problems and never block a merge.
  quality-report:
    name: Advisory quality report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unused files, exports and dependencies (Knip)
        run: npm run quality:unused
        continue-on-error: true
      - name: Duplicate code (jscpd)
        run: npm run quality:dupes
        continue-on-error: true
